        cx.fillStyle = t;
        cx.fillRect(-13, -210, 26, 220);
        cx.restore();
        // head: a bell, not a face
        cx.fillStyle = C.boneD;
        cx.beginPath();
        cx.moveTo(-40, -198);
        cx.quadraticCurveTo(0, -268, 40, -198);
        cx.quadraticCurveTo(0, -176, -40, -198);
        cx.fill();
        cx.fillStyle = C.bone;
        cx.beginPath();
        cx.moveTo(-31, -200);
        cx.quadraticCurveTo(0, -256, 31, -200);
        cx.quadraticCurveTo(0, -182, -31, -200);
        cx.fill();
        cx.save();
        cx.globalCompositeOperation = "lighter";
        cx.fillStyle = `rgba(255,220,150,${0.35 + sing * 0.4})`;
        cx.beginPath();
        cx.ellipse(0, -198, 26, 9, 0, 0, 7);
        cx.fill();
        cx.restore();
        cx.restore();

        if (k.say < 60) {
          cx.fillStyle = `rgba(232,194,106,${((60 - k.say) / 60) * 0.75})`;
          cx.font = "15px ui-monospace,monospace";
          cx.textAlign = "center";
          cx.fillText('"wren"', k.x, k.y - 290);
        }
      }

      /* ═════════════════ WREN ═════════════════
   No HUD. Health is her spine. Charge is the barrel. */
      function drawWren() {
        const w = W,
          flick = w.iframe > 0 && Math.floor(G.t * 0.35) % 2;
        cx.save();
        cx.translate(w.x, w.y);
        const bob = w.grounded ? Math.sin(w.walkCycle * Math.PI) * 1.8 : 0;
        cx.translate(0, bob);
        const f = w.face;

        // legs
        const ls = w.grounded ? Math.sin(w.walkCycle * Math.PI) * 11 : 5;
        cx.strokeStyle = "#151d26";
        cx.lineWidth = 11;
        cx.lineCap = "round";
        cx.beginPath();
        cx.moveTo(-2, 6);
        cx.lineTo(-2 + ls, 34);
        cx.moveTo(3, 6);
        cx.lineTo(3 - ls, 34);
        cx.stroke();
        cx.strokeStyle = "#26313d";
        cx.lineWidth = 7;
        cx.beginPath();
        cx.moveTo(-2, 6);
        cx.lineTo(-2 + ls, 34);
        cx.moveTo(3, 6);
        cx.lineTo(3 - ls, 34);
        cx.stroke();
        cx.fillStyle = "#1a232d";
        cx.fillRect(-2 + ls - 6, 32, 13, 6);
        cx.fillRect(3 - ls - 6, 32, 13, 6);

        // torso — EVA rig
        cx.fillStyle = flick ? "#4a5c6b" : "#232c37";
        roundRect(-13, -30, 26, 38, 5);
        cx.fill();
        cx.fillStyle = "#2f3c49";
        roundRect(-13, -30, 26, 11, 4);
        cx.fill();
        cx.strokeStyle = C.cyanDim;
        cx.lineWidth = 1.6;
        cx.beginPath();
        cx.moveTo(-10, -14);
        cx.lineTo(10, -14);
        cx.stroke();

        // ── SPINE: the health bar, on her back
        const bx = -f * 11;
        // D.spineLie darkens one vertebra she did not actually lose
        const liar = D.spineLie > 0 ? (w.hp - 1 + w.maxhp) % w.maxhp : -1;
        for (let i = 0; i < w.maxhp; i++) {
          const lit = i < w.hp && i !== liar;
          const vy = -26 + i * 8.2;
          cx.fillStyle = lit
            ? w.hurtFlash > 0
              ? "#ffd0d0"
              : C.cyan
            : "#20272e";
          cx.beginPath();
          cx.ellipse(bx, vy, 3.4, 2.4, 0, 0, 7);
          cx.fill();
          if (lit) {
            cx.save();
            cx.globalCompositeOperation = "lighter";
            const g = cx.createRadialGradient(bx, vy, 0, bx, vy, 11);
            g.addColorStop(0, "rgba(143,217,255,.5)");
            g.addColorStop(1, "rgba(143,217,255,0)");
            cx.fillStyle = g;
            cx.beginPath();
            cx.arc(bx, vy, 11, 0, 7);
            cx.fill();
            cx.restore();
          }
        }

        // head
        cx.fillStyle = "#1b242e";
        cx.beginPath();
        cx.ellipse(f * 1.5, -40, 10.5, 10, 0, 0, 7);
        cx.fill();
        cx.fillStyle = "#2c3844";
        cx.beginPath();
        cx.ellipse(f * 1.5, -43, 10, 6, 0, 0, 7);
        cx.fill();
        cx.fillStyle = C.cyan;
        cx.beginPath();
        cx.ellipse(f * 6, -40, 3.4, 2.6, 0, 0, 7);
        cx.fill();
        cx.save();
        cx.globalCompositeOperation = "lighter";
        const hg = cx.createRadialGradient(f * 6, -40, 0, f * 6, -40, 16);
        hg.addColorStop(0, "rgba(143,217,255,.45)");
        hg.addColorStop(1, "rgba(143,217,255,0)");
        cx.fillStyle = hg;
        cx.beginPath();
        cx.arc(f * 6, -40, 16, 0, 7);
        cx.fill();
        cx.restore();

        // ── ARM + CUTTER, aimed at the mouse
        cx.save();
        cx.translate(0, -16);
        cx.rotate(w.aim);
        cx.strokeStyle = "#2b3743";
        cx.lineWidth = 8;
        cx.lineCap = "round";
        cx.beginPath();
        cx.moveTo(0, 0);
        cx.lineTo(19, 0);
        cx.stroke();
        // body of the cutter
        cx.fillStyle = "#39485a";
        roundRect(17, -6, 26, 12, 3);
        cx.fill();
        cx.fillStyle = "#4d5f73";
        cx.fillRect(19, -4, 7, 8);
        // the two emitter prongs show the cut orientation
        cx.strokeStyle = C.cyan;
        cx.lineWidth = 2.6;
        if (G.vert) {
          cx.beginPath();
          cx.moveTo(43, -11);
          cx.lineTo(43, 11);
          cx.stroke();
        } else {
          cx.beginPath();
          cx.moveTo(40, -4);
          cx.lineTo(50, -4);
          cx.moveTo(40, 4);
          cx.lineTo(50, 4);
          cx.stroke();
        }
        // charge notches on the barrel
        for (let i = 0; i < MAXCHARGE; i++) {
          const lit = i < w.charge;
          const low = w.charge <= 2 && Math.floor(G.t * 0.25) % 2;
          cx.fillStyle = lit ? (low ? "#ff9d6b" : C.cyan) : "#1d242c";
          cx.fillRect(19 + i * 2.9, -8.6, 2, 2.2);
        }
        cx.restore();

        // fork count, on the hip
        for (let i = 0; i < w.forks; i++) {
          cx.strokeStyle = "rgba(207,232,246,.85)";
          cx.lineWidth = 1.6;
          const px = -f * 9 - i * 4;
          cx.beginPath();
          cx.moveTo(px, 2);
          cx.lineTo(px, 10);
          cx.stroke();
        }
        cx.restore();

        // aim line — faint, so you can read the cut plane before you spend a charge
        const ax = w.x + Math.cos(w.aim) * 54,
          ay = w.y - 16 + Math.sin(w.aim) * 54;
        const bx2 = w.x + Math.cos(w.aim) * 760,
          by2 = w.y - 16 + Math.sin(w.aim) * 760;
        cx.save();
        cx.globalAlpha = 0.1;
        cx.strokeStyle = C.cyan;
        cx.lineWidth = 1;
        cx.setLineDash([6, 10]);
        cx.beginPath();
        cx.moveTo(ax, ay);
        cx.lineTo(bx2, by2);
        cx.stroke();
        cx.restore();
      }
      function roundRect(x, y, w, h, r) {
        cx.beginPath();
        cx.moveTo(x + r, y);
        cx.arcTo(x + w, y, x + w, y + h, r);
        cx.arcTo(x + w, y + h, x, y + h, r);
        cx.arcTo(x, y + h, x, y, r);
        cx.arcTo(x, y, x + w, y, r);
        cx.closePath();
      }

      function drawSparks() {
        for (const s of sparks) {
          if (s.kind === "beam") {
            const a = s.life / 9;
            cx.save();
            cx.globalCompositeOperation = "lighter";
            cx.strokeStyle = `rgba(190,235,255,${a * 0.85})`;
            cx.lineWidth = s.vert ? 2 : 3.4;
            cx.beginPath();
            cx.moveTo(s.x1, s.y1);
            cx.lineTo(s.x2, s.y2);
            cx.stroke();
            cx.strokeStyle = `rgba(255,255,255,${a})`;
            cx.lineWidth = 1.2;
            cx.beginPath();
            cx.moveTo(s.x1, s.y1);
            cx.lineTo(s.x2, s.y2);
            cx.stroke();
            // the cut plane, drawn at the impact point
            cx.strokeStyle = `rgba(143,217,255,${a * 0.7})`;
            cx.lineWidth = 2.4;
            cx.beginPath();
            if (s.vert) {
              cx.moveTo(s.x2, s.y2 - 19);
              cx.lineTo(s.x2, s.y2 + 19);
            } else {
              cx.moveTo(s.x2 - 19, s.y2);
              cx.lineTo(s.x2 + 19, s.y2);
            }
            cx.stroke();
            cx.restore();
          } else if (s.kind === "label") {
            const a = Math.min(1, s.life / 26);
            cx.fillStyle = `rgba(${hexRgb(s.col)},${a})`;
            cx.font = "700 12px ui-monospace,monospace";
            cx.textAlign = "center";
            cx.fillText(s.t, s.x, s.y - (44 - s.life) * 0.6);
          }
        }
      }
      function hexRgb(h) {
        const n = parseInt(h.slice(1), 16);
        return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
      }
      function drawBits() {
        for (const b of bits) {
          cx.globalAlpha = Math.min(1, b.life / 22);
          cx.fillStyle = b.col;
          cx.beginPath();
          cx.arc(b.x, b.y, b.r, 0, 7);
          cx.fill();
        }
        cx.globalAlpha = 1;
      }

      /* one warm wash from every living organ — the only warm light in the station */
      function drawLightWash() {
        cx.save();
        cx.globalCompositeOperation = "lighter";
        for (const e of foes) {
          if (e.dead) continue;
          const n = e.parts.filter((p) => p.alive).length;
          if (!n) continue;
          const r = (e.type === "bellows" ? 300 : 180) * (n / 6 + 0.35);
          const g = cx.createRadialGradient(e.x, e.y - 20, 0, e.x, e.y - 20, r);
          g.addColorStop(0, `rgba(255,168,88,${0.11 * (n / 6) + 0.03})`);
          g.addColorStop(1, "rgba(255,120,50,0)");
          cx.fillStyle = g;
          cx.beginPath();
          cx.arc(e.x, e.y - 20, r, 0, 7);
          cx.fill();
        }
        cx.restore();
      }

      /* ═══════════════════════════ OVERLAY ═══════════════════════════ */
      function drawOverlay() {
        // damage vignette (diegetic: her visor fogging)
        if (W.hurtFlash > 0) {
          cx.fillStyle = `rgba(150,26,32,${(W.hurtFlash / 30) * 0.3})`;
          cx.fillRect(0, 0, VW, VH);
        }
        if (G.flash > 0) {
          cx.fillStyle = `rgba(255,240,225,${G.flash * 0.8})`;
          cx.fillRect(0, 0, VW, VH);
        }

        // Low health crusts the visor EDGE. It stays out of the picture until
        // it is actually urgent — a permanent pink wash just hides the game.
        const lowP = Math.max(0, 1 - W.hp / 2) * (W.hp > 0 ? 1 : 0);
        if (lowP > 0) {
          const pulse = 0.72 + Math.sin(G.t * 0.07) * 0.28;
          const v = cx.createRadialGradient(
            VW / 2,
            VH / 2,
            VH * 0.62,
            VW / 2,
            VH / 2,
            VH * 0.98,
          );
          v.addColorStop(0, "rgba(0,0,0,0)");
          v.addColorStop(1, `rgba(126,12,18,${lowP * 0.5 * pulse})`);
          cx.fillStyle = v;
          cx.fillRect(0, 0, VW, VH);
        }
        const v = cx.createRadialGradient(
          VW / 2,
          VH / 2,
          VH * 0.38,
          VW / 2,
          VH / 2,
          VH * 1.0,
        );
        v.addColorStop(0, "rgba(0,0,0,0)");
        v.addColorStop(1, "rgba(0,0,0,.55)");
        cx.fillStyle = v;
        cx.fillRect(0, 0, VW, VH);

        // grain
        cx.fillStyle = "rgba(255,255,255,.014)";
        for (let i = 0; i < 46; i++)
          cx.fillRect((Math.random() * VW) | 0, (Math.random() * VH) | 0, 2, 2);

        // chapter slug, top-left, small and diegetic
        cx.font = "11px ui-monospace,monospace";
        cx.textAlign = "left";
        cx.fillStyle = "rgba(143,217,255,.34)";
        cx.fillText(`CANTOR · ${CH[G.ch].place}`, 26, 30);

        // cut orientation, bottom-right, minimal
        cx.textAlign = "right";
        cx.fillStyle = "rgba(143,217,255,.55)";
        cx.fillText(
          G.vert ? "CUT │ VERTICAL   [Q]" : "CUT ─ HORIZONTAL   [Q]",
          VW - 26,
          VH - 26,
        );

        // her name, arriving from a deck nothing is standing on
        if (D.nameWhisper > 0) {
          const a = Math.min(1, D.nameWhisper / 60) * 0.8;
          cx.textAlign = "center";
          cx.font = "italic 17px ui-monospace,monospace";
          cx.fillStyle = `rgba(232,194,106,${a})`;
          cx.fillText('"wren"', VW / 2, 132);
        }

        // subtitles
        if (G.subT > 0 && G.sub) {
          const a = Math.min(1, G.subT / 70);
          cx.textAlign = "center";
          cx.font = "15px ui-monospace,monospace";
          const lines = G.sub.split("\n");
          lines.forEach((ln, i) => {
            const tw = cx.measureText(ln).width;
            cx.fillStyle = `rgba(6,9,13,${0.66 * a})`;
            cx.fillRect(VW / 2 - tw / 2 - 14, VH - 124 + i * 26, tw + 28, 24);
            cx.fillStyle = ln.startsWith("WREN")
              ? `rgba(207,232,246,${a})`
              : `rgba(232,194,106,${a})`;
            cx.fillText(ln, VW / 2, VH - 106 + i * 26);
          });
        }

        // first-run controls
        if (G.ch === 0 && G.t < 900) {
          cx.textAlign = "left";
          cx.fillStyle = "rgba(120,150,172,.40)";
          cx.font = "12px ui-monospace,monospace";
          cx.fillText(
            "WASD move · SHIFT run (loud) · MOUSE aim · CLICK cut · Q rotate cut · F tuning fork · E read",
            26,
            VH - 26,
          );
        }
      }

      function drawCrosshair() {
        const charged = !W || W.charge > 0;
        cx.save();
        cx.translate(mx, my);
        cx.strokeStyle = charged
          ? "rgba(143,217,255,.85)"
          : "rgba(255,120,90,.8)";
        cx.lineWidth = 1.6;
        if (G.vert) {
          cx.beginPath();
          cx.moveTo(0, -13);
          cx.lineTo(0, -4);
          cx.moveTo(0, 4);
          cx.lineTo(0, 13);
          cx.stroke();
        } else {
          cx.beginPath();
          cx.moveTo(-13, 0);
          cx.lineTo(-4, 0);
          cx.moveTo(4, 0);
          cx.lineTo(13, 0);
          cx.stroke();
        }
        cx.fillStyle = "rgba(207,232,246,.9)";
        cx.fillRect(-1, -1, 2, 2);
        cx.restore();
      }

      function drawTerminal() {
        cx.fillStyle = "rgba(5,8,12,.88)";
        cx.fillRect(0, 0, VW, VH);
        const lines = G.term.split("\n");
        const bw = 720,
          bh = 86 + lines.length * 26;
        const bx = VW / 2 - bw / 2,
          by = VH / 2 - bh / 2;
        cx.fillStyle = "#0b1219";
        cx.fillRect(bx, by, bw, bh);
        cx.strokeStyle = "rgba(143,217,255,.35)";
        cx.lineWidth = 1;
        cx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
        cx.fillStyle = "rgba(143,217,255,.5)";
        cx.fillRect(bx, by, bw, 2);
        cx.textAlign = "left";
        cx.font = "14px ui-monospace,monospace";
        lines.forEach((ln, i) => {
          cx.fillStyle =
            i === 0 ? "rgba(143,217,255,.9)" : "rgba(196,214,226,.82)";
          cx.fillText(ln, bx + 34, by + 48 + i * 26);
        });
        cx.fillStyle = "rgba(143,217,255,.45)";
        cx.textAlign = "center";
        cx.font = "12px ui-monospace,monospace";
        cx.fillText("ESC / CLICK TO CLOSE", VW / 2, by + bh - 18);
      }

      /* ═══════════════════════════ SCREENS ═══════════════════════════ */
      function letter(t, y, size, col, sp) {
        cx.font = `700 ${size}px ui-monospace,monospace`;
        const chars = [...t];
        const w =
          chars.reduce((a, c) => a + cx.measureText(c).width + sp, 0) - sp;
        let x = VW / 2 - w / 2;
        cx.textAlign = "left";
        cx.fillStyle = col;
        for (const c of chars) {
          cx.fillText(c, x, y);
          x += cx.measureText(c).width + sp;
        }
      }
      function titleScreen() {
        G.t++;
        const g = cx.createRadialGradient(
          VW / 2,
          VH * 0.52,
          20,
          VW / 2,
          VH * 0.52,
          720,
        );
        g.addColorStop(
          0,
          `rgba(232,194,106,${0.1 + Math.sin(G.t * 0.017) * 0.04})`,
        );
        g.addColorStop(0.45, "rgba(180,110,50,.04)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        cx.fillStyle = g;
        cx.fillRect(0, 0, VW, VH);
        // six voices as six bars, the chord. Sits in its own band under the
        // subtitle — never behind the copy.
        for (let i = 0; i < 6; i++) {
          const h = 14 + Math.sin(G.t * 0.02 + i * 1.3) * 11;
          const x = VW / 2 - 137 + i * 55;
          cx.fillStyle = `rgba(232,194,106,${0.18 + Math.sin(G.t * 0.02 + i * 1.3) * 0.12})`;
          cx.fillRect(x, 322 - h / 2, 18, h);
        }
        letter("CANTOR", 250, 74, "#e9e2d4", 22);
        cx.textAlign = "center";
        cx.font = "12px ui-monospace,monospace";
        cx.fillStyle = "rgba(143,217,255,.6)";
        cx.fillText(
          "DEEP-SPACE LISTENING POST · 11 MONTHS SINCE THE SIGNAL",
          VW / 2,
          288,
        );
        cx.fillStyle = "rgba(160,182,196,.68)";
        cx.font = "14px ui-monospace,monospace";
        cx.fillText(
          "It is not a message. It is a chord, and it wants to be performed.",
          VW / 2,
          400,
        );
        cx.fillText(
          "They are blind. They hunt what they can hear.",
          VW / 2,
          428,
        );
        cx.fillText(
          "You cannot kill a body. You can only take its voice apart.",
          VW / 2,
          456,
        );
        cx.fillStyle = `rgba(232,194,106,${0.4 + Math.sin(G.t * 0.05) * 0.35})`;
        cx.font = "13px ui-monospace,monospace";
        cx.fillText("CLICK TO WAKE", VW / 2, 546);
        cx.fillStyle = "rgba(110,136,156,.45)";
        cx.font = "12px ui-monospace,monospace";
        cx.fillText(
          "WASD · SHIFT run · MOUSE aim · CLICK cut · Q rotate cut · F fork · E read",
          VW / 2,
          596,
        );
        cx.fillStyle = "rgba(110,136,156,.3)";
        cx.fillText("headphones strongly recommended", VW / 2, 622);
        drawCrosshair();
      }
      function deadScreen() {
        cx.fillStyle = "rgba(10,4,5,.86)";
        cx.fillRect(0, 0, VW, VH);
        letter("PERFORMED", 316, 52, "#d8c9b4", 18);
        cx.textAlign = "center";
        cx.font = "14px ui-monospace,monospace";
        cx.fillStyle = "rgba(200,180,150,.7)";
        cx.fillText(
          "You are a voice in it now. It was always going to need a seventh.",
          VW / 2,
          372,
        );
        cx.fillStyle = `rgba(232,194,106,${0.35 + Math.sin(G.t * 0.05) * 0.3})`;
        cx.font = "13px ui-monospace,monospace";
        cx.fillText("CLICK TO WAKE AGAIN", VW / 2, 440);
        drawCrosshair();
      }
      function choiceScreen() {
        G.t++;
        if (G.ending) return endingScreen();
        cx.fillStyle = "#080b10";
        cx.fillRect(0, 0, VW, VH);
        const g = cx.createRadialGradient(
          VW / 2,
          VH * 0.5,
          10,
          VW / 2,
          VH * 0.5,
          700,
        );
        g.addColorStop(0, "rgba(232,194,106,.07)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        cx.fillStyle = g;
        cx.fillRect(0, 0, VW, VH);
        letter("ANTENNA CONTROL", 130, 30, "#cfe8f6", 12);
        cx.textAlign = "center";
        cx.font = "14px ui-monospace,monospace";
        cx.fillStyle = "rgba(180,198,210,.78)";
        const lines = [
          "The array is yours again. Bearing two nine one point four.",
          "Shutting it down changes nothing. It has known where we are for eleven months.",
          "",
          "You can send the inverse of the chord. Forty seconds. Full power.",
          "It will silence every resonant body inside four light-hours.",
          "You are a resonant body inside four light-hours.",
        ];
        lines.forEach((l, i) => cx.fillText(l, VW / 2, 208 + i * 28));

        const A1 = { x: VW / 2 - 330, y: 440, w: 290, h: 96 },
          A2 = { x: VW / 2 + 40, y: 440, w: 290, h: 96 };
        for (const [box, title, sub, col] of [
          [A1, "TRANSMIT", "forty seconds. all of it.", "#e8c26a"],
          [A2, "STAY SILENT", "and be found.", "#8fd9ff"],
        ]) {
          const hot =
            mx > box.x &&
            mx < box.x + box.w &&
            my > box.y &&
            my < box.y + box.h;
          cx.fillStyle = hot ? "rgba(24,32,41,.95)" : "rgba(14,19,26,.9)";
          cx.fillRect(box.x, box.y, box.w, box.h);
          cx.strokeStyle = hot ? col : "rgba(90,112,130,.5)";
          cx.lineWidth = hot ? 2 : 1;
          cx.strokeRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1);
          cx.fillStyle = col;
          cx.font = "700 20px ui-monospace,monospace";
          cx.textAlign = "center";
          cx.fillText(title, box.x + box.w / 2, box.y + 44);
          cx.fillStyle = "rgba(160,180,195,.6)";
          cx.font = "12px ui-monospace,monospace";
          cx.fillText(sub, box.x + box.w / 2, box.y + 70);
          if (hot && mDown) {
            G.ending = title === "TRANSMIT" ? "transmit" : "silent";
            A.setVoices(0);
            A.tone(title === "TRANSMIT" ? 55 : 220, 3, "sine", 0.2);
          }
        }
        drawCrosshair();
      }
      function endingScreen() {
        const t = G.ending === "transmit";
        cx.fillStyle = t ? "#f2ece0" : "#06080c";
        cx.fillRect(0, 0, VW, VH);
        letter(
          t ? "SILENCE" : "STILL LISTENING",
          300,
          46,
          t ? "#221c14" : "#cfe8f6",
          16,
        );
        cx.textAlign = "center";
        cx.font = "14px ui-monospace,monospace";
        cx.fillStyle = t ? "rgba(40,32,24,.8)" : "rgba(170,192,206,.8)";
        const txt = t
          ? [
              "Forty seconds at full power on bearing 291.4.",
              "Every hollowed chest inside four light-hours stops at once, including one",
              "on Deck 0 that used to be an acoustic engineer.",
              "",
              "Cantor keeps station. The antenna keeps pointing.",
              "Whatever is coming arrives in nine years to a quiet room.",
            ]
          : [
              "You leave the array pointed where it has always pointed.",
              "The Voiced go still by themselves eventually. They were only ever",
              "holding the note until something better arrived to hold it.",
              "",
              "You have air for four years and no one to talk to,",
              "and every night at 03:40 the hull hums forty seconds in six parts.",
            ];
        txt.forEach((l, i) => cx.fillText(l, VW / 2, 372 + i * 26));
        cx.fillStyle = t ? "rgba(40,32,24,.45)" : "rgba(232,194,106,.45)";
        cx.font = "12px ui-monospace,monospace";
        cx.fillText("CLICK TO RETURN", VW / 2, 620);
        drawCrosshair();
      }

      function screenKey() {
        if (G.state === "title") {
          G.ch = 0;
          loadChapter(0);
        } else if (G.state === "dead") {
          loadChapter(G.ch);
        } else if (G.state === "choice" && G.ending) {
          G.ending = null;
          G.state = "title";
          G.ch = 0;
        }
      }

      /* ═══════════════════════════ LOOP ═══════════════════════════ */
      let last = 0;
      let frameErrs = 0;
      function frame(ts) {
        const dt = Math.min(2.4, (ts - last) / 16.667) || 1;
        last = ts;
        // A throw in here used to kill the RAF chain silently and the game
        // just froze on whatever was last painted. Never again: keep looping,
        // and say so loudly the first few times.
        try {
          update(dt);
          for (const s of sparks) s.life -= dt;
          render();
        } catch (err) {
          if (frameErrs++ < 5) console.error("[CANTOR] frame error:", err);
        }
        requestAnimationFrame(frame);
      }

      /* ═══════════════════════════ SELFTEST ═══════════════════════════ */
      if (location.search.includes("test")) {
        const out = [],
          ok = (c, m) => out.push((c ? "PASS  " : "FAIL  ") + m);
        CH.forEach((c, i) => {
          ok(
            c.rows.length === ROWS,
            `CH${i} ${ROWS} rows (got ${c.rows.length})`,
          );
          ok(
            new Set(c.rows.map((r) => r.length)).size === 1,
            `CH${i} rows padded equal`,
          );
          const all = c.rows.join("");
          ok((all.match(/P/g) || []).length === 1, `CH${i} one spawn`);
          ok(all.includes(">"), `CH${i} has exit`);
          ok(
            (all.match(/T/g) || []).length === Object.keys(c.terms).length,
            `CH${i} terminal tiles match term text (${(all.match(/T/g) || []).length} vs ${Object.keys(c.terms).length})`,
          );
          // vertical usage: the Eye's finding — no more dead canvas
          const used = c.rows.filter(
            (r, y) =>
              y > 0 &&
              y < ROWS - 1 &&
              [...r].filter((ch) => "#HDT>".includes(ch)).length > 2,
          ).length;
          ok(used >= 9, `CH${i} uses ${used}/13 interior rows (need 9+)`);
        });
        loadChapter(0);
        ok(!solid(W.x, W.y), "spawn not inside geometry");
        for (let i = 0; i < 300 && !W.grounded; i++) {
          W.vy = Math.min(17, W.vy + GRAV);
          W.y += W.vy;
          moveY(W);
        }
        ok(W.grounded, "Wren lands on solid floor from spawn");

        // part geometry is shared by draw + hit test
        const e = foes[0];
        poseParts(e, 1);
        ok(
          e.parts.every((p) => isFinite(p.ax) && isFinite(p.by)),
          "all parts have world coords",
        );

        // orientation gate actually gates
        const arm = e.parts.find((p) => p.id === "larm");
        arm.ang = 0; // perfectly horizontal
        ok(
          orientOK(arm, false) && !orientOK(arm, true),
          "horizontal limb: H cut yes, V cut no",
        );
        arm.ang = Math.PI / 2; // perfectly vertical
        ok(
          orientOK(arm, true) && !orientOK(arm, false),
          "vertical limb: V cut yes, H cut no",
        );
        const throat = e.parts.find((p) => p.id === "throat");
        ok(
          orientOK(throat, true) && orientOK(throat, false),
          "nodes ignore cut orientation",
        );

        // core is shielded until throat + legs are gone
        ok(coreLocked(e), "core shielded while throat/legs alive");
        e.parts
          .filter((p) => p.role === "call" || p.role === "drive")
          .forEach((p) => (p.alive = false));
        ok(!coreLocked(e), "core exposed once throat + both legs are severed");

        // noise: silence is genuinely invisible
        W.noise = 0;
        ok(
          loudest({ x: W.x + 200, y: W.y }) === null,
          "silent Wren is inaudible at 200px",
        );
        W.noise = 100;
        ok(
          loudest({ x: W.x + 200, y: W.y }) !== null,
          "loud Wren is audible at 200px",
        );
        ok(
          noiseReach(0) < 100 && noiseReach(100) > 700,
          `noise reach ${noiseReach(0) | 0}px .. ${noiseReach(100) | 0}px`,
        );

        // the doubt system: it must lie, vary its lies, shut up during a real
        // fight, and never actually hurt her
        (function doubt() {
          foes.length = 0;
          ghosts.length = 0;
          cantor = null;
          D.echo.length = 0;
          const real = mkReed(0, 0);
          real.x = W.x + 200;
          real.y = W.y;
          foes.push(real);
          D.cool = -1;
          for (let i = 0; i < 40; i++) updateDoubt(1);
          ok(
            ghosts.length === 0 && D.echo.length === 0,
            "no lie fires while a real threat is within 460px",
          );
          foes.length = 0;
          const seen = {};
          for (let k = 0; k < 300; k++) {
            D.cool = -1;
            updateDoubt(1);
            seen[D.lastLie] = 1;
          }
          ok(
            Object.keys(seen).length >= 4,
            `doubt uses ${Object.keys(seen).length}/5 lies`,
          );
          // a phantom eats the beam and leaves nothing behind
          ghosts.length = 0;
          D.cool = 1e9;
          const g = mkReed(0, 0);
          g.x = W.x + 420;
          g.y = W.y;
          g.face = -1;
          g.life = 200;
          poseParts(g, 1);
          ghosts.push(g);
          W.aim = Math.atan2(g.y - (W.y - 16), g.x - W.x);
          sparks.length = 0;
          fire();
          ok(ghosts.length === 0, "shooting a phantom dissolves it");
          ok(
            sparks.some((z) => z.kind === "label" && z.t === "NOTHING THERE"),
            "phantom shot names itself as a lie",
          );
          // and a phantom standing on top of her does no damage
          const hp0 = W.hp;
          ghosts.push(mkReed(W.x, W.y));
          for (let i = 0; i < 40; i++) update(1);
          ok(W.hp === hp0, "a phantom never costs health, only nerve");
          ghosts.length = 0;
          foes.length = 0;
        })();

        // the whole kill chain, end to end, through the real fire() path
        (function killChain() {
          foes.length = 0;
          const r = mkReed(0, 0);
          r.x = W.x + 280;
          r.y = W.y;
          r.face = -1;
          r.vx = 0;
          foes.push(r);
          poseParts(r, 1);
          const core = r.parts.find((p) => p.id === "core");
          const aim = (x, y) => (W.aim = Math.atan2(y - (W.y - 16), x - W.x));
          const label = () => {
            sparks.length = 0;
            fire();
            const l = sparks.filter((z) => z.kind === "label");
            return l.length ? l[0].t : "HIT";
          };
          r.parts
            .filter((p) => p.role === "reach")
            .forEach((p) => (p.alive = false));
          G.vert = false;
          aim(core.ax, core.ay);
          ok(
            label() === "SHIELDED",
            "core refuses the cut while throat + legs live",
          );
          ok(core.hp === core.max, "shielded core takes no damage");
          r.parts
            .filter((p) => p.role === "call" || p.role === "drive")
            .forEach((p) => (p.alive = false));
          aim(core.ax, core.ay);
          for (let i = 0; i < core.max; i++) label();
          ok(r.dead, "severing throat + legs then the core kills it");
          foes.length = 0;
        })();

        // scale discipline: the Eye's other finding
        ok(
          W.h / VH > 0.09,
          `Wren is ${((W.h / VH) * 100).toFixed(1)}% of screen height (need >9%)`,
        );
        const bel = mkBellows(0, 0),
          can = mkCantor(0, 0);
        ok(
          bel.h / VH > 0.3,
          `Bellows is ${((bel.h / VH) * 100).toFixed(0)}% of screen height`,
        );
        ok(
          can.h / VH > 0.5,
          `the Cantor is ${((can.h / VH) * 100).toFixed(0)}% of screen height`,
        );

        const el = document.createElement("pre");
        el.id = "test";
        el.textContent =
          out.join("\n") +
          `\n\n${out.filter((l) => l[0] === "P").length}/${out.length} passed`;
        document.body.appendChild(el);
      } else {
        requestAnimationFrame(frame);
      }
    </script>
  </body>
</html>
