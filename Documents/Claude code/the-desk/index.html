<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PendulumPro · Control Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #060707;
        --bg-2: #0c0e0d;
        --surface: #101312;
        --surface-2: #161a18;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --green: #00c805;
        --green-soft: #7cffa0;
        --green-dim: #0a7d22;
        --loss: #ff5000;
        --text: #f4f6f5;
        --muted: #8b938d;
        --muted-2: #5b635d;
        --display: "Bricolage Grotesque", serif;
        --body: "Hanken Grotesk", sans-serif;
        --mono: "JetBrains Mono", monospace;
        --bar-bg: rgba(6, 7, 7, 0.85);
        --glow-op: 1;
      }
      [data-theme="light"] {
        --bg: #f6f7f5;
        --bg-2: #eceee9;
        --surface: #ffffff;
        --surface-2: #f1f3ef;
        --line: rgba(0, 0, 0, 0.1);
        --line-strong: rgba(0, 0, 0, 0.16);
        --green: #07a013;
        --green-soft: #0a7d22;
        --green-dim: #9fd9a8;
        --loss: #e64500;
        --text: #0d0f0e;
        --muted: #5b635d;
        --muted-2: #6f766f;
        --bar-bg: rgba(246, 247, 245, 0.88);
        --glow-op: 0.35;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      .grid-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(
          ellipse 80% 60% at 50% 0%,
          #000 40%,
          transparent 85%
        );
        mask-image: radial-gradient(
          ellipse 80% 60% at 50% 0%,
          #000 40%,
          transparent 85%
        );
        opacity: 0.3;
      }
      .glow {
        position: fixed;
        width: 46vw;
        height: 46vw;
        left: -10vw;
        top: -12vw;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(0, 200, 5, 0.12),
          transparent 70%
        );
        opacity: var(--glow-op);
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px 100px;
      }

      /* top bar */
      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 22px;
        flex-wrap: wrap;
        padding: 16px 24px;
        margin: 0 -24px 8px;
        background: var(--bar-bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      html {
        scroll-behavior: smooth;
      }
      .nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .nav a {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
        padding: 5px 9px;
        border-radius: 7px;
        border: 1px solid transparent;
      }
      .nav a:hover {
        color: var(--green);
        border-color: var(--green-dim);
      }
      .toggle {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 6px 11px;
        cursor: pointer;
      }
      .toggle:hover {
        color: var(--text);
        border-color: var(--green-dim);
      }
      .toggle.on {
        color: var(--green);
        border-color: var(--green-dim);
        background: rgba(0, 200, 5, 0.08);
      }
      .anchor {
        scroll-margin-top: 96px;
      }
      /* plain-english mode: hide the analyst grid, show the ELI5 block */
      .eli5 {
        display: none;
        border-top: 1px solid var(--line);
        padding: 16px 20px;
        font-size: 1rem;
        line-height: 1.55;
        color: var(--text);
      }
      .eli5 .lab {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--green);
        display: block;
        margin-bottom: 8px;
      }
      body.plain .roles {
        display: none;
      }
      body.plain .eli5 {
        display: block;
      }
      .brand {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.18em;
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text);
      }
      .brand .tick {
        color: var(--green);
      }
      .live {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 3px 9px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: none;
        cursor: pointer;
      }
      .live:hover {
        border-color: var(--muted);
        color: var(--text);
      }
      .live .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted-2);
      }
      .live.on {
        color: var(--green);
        border-color: var(--green-dim);
      }
      .live.on .dot {
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .bar .stat {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .bar .stat .k {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.12em;
        color: var(--muted-2);
        text-transform: uppercase;
      }
      .bar .stat .v {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .bar .spacer {
        flex: 1;
      }
      .up {
        color: var(--green);
      }
      .dn {
        color: var(--loss);
      }
      .flat {
        color: var(--muted);
      }

      h1 {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(2rem, 5vw, 3.2rem);
        letter-spacing: -0.03em;
        line-height: 1;
        margin: 34px 0 6px;
      }
      .sub {
        color: var(--muted);
        max-width: 60ch;
        margin-bottom: 8px;
      }
      .section-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.22em;
        color: var(--green);
        text-transform: uppercase;
        margin: 42px 0 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .section-label::before {
        content: "";
        width: 26px;
        height: 1px;
        background: var(--green);
      }
      .section-label .count {
        color: var(--muted-2);
        letter-spacing: 0.1em;
      }

      /* playbook check chips */
      .checks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      @media (max-width: 760px) {
        .checks {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 16px;
        background: var(--surface);
        position: relative;
        overflow: hidden;
      }
      .chip.fail {
        border-color: rgba(255, 80, 0, 0.4);
      }
      .chip.pass {
        border-color: var(--green-dim);
      }
      .chip .lab {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .chip .big {
        font-family: var(--display);
        font-size: 1.7rem;
        font-weight: 700;
      }
      .chip .meta {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 5px;
      }
      .chip .tag {
        position: absolute;
        top: 14px;
        right: 14px;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.1em;
        padding: 2px 7px;
        border-radius: 10px;
      }
      .chip.fail .tag {
        background: rgba(255, 80, 0, 0.14);
        color: var(--loss);
      }
      .chip.pass .tag {
        background: rgba(0, 200, 5, 0.14);
        color: var(--green);
      }

      /* headline */
      .headline {
        border-left: 2px solid var(--green);
        padding: 14px 0 14px 20px;
        margin: 6px 0 4px;
        font-family: var(--display);
        font-size: clamp(1.15rem, 2.4vw, 1.5rem);
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }

      /* proposal cards */
      .prop {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(160deg, var(--surface), var(--bg-2));
        margin-bottom: 14px;
        overflow: hidden;
        transition: border-color 0.3s;
      }
      .prop:hover {
        border-color: var(--green-dim);
      }
      .prop.sell {
      }
      .prop-head {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        flex-wrap: wrap;
      }
      .act {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 5px 11px;
        border-radius: 7px;
      }
      .act.TRIM {
        background: rgba(255, 180, 0, 0.14);
        color: #ffb400;
      }
      .act.SELL {
        background: rgba(255, 80, 0, 0.16);
        color: var(--loss);
      }
      .act.BUY {
        background: rgba(0, 200, 5, 0.16);
        color: var(--green);
      }
      .prop-sym {
        font-family: var(--display);
        font-size: 1.5rem;
        font-weight: 700;
      }
      .prop-size {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .prop-actions {
        margin-left: auto;
        display: flex;
        gap: 9px;
      }
      .btn {
        font-family: var(--mono);
        font-size: 12px;
        padding: 9px 18px;
        border-radius: 8px;
        cursor: pointer;
        border: none;
        letter-spacing: 0.04em;
      }
      .btn.approve {
        background: var(--green);
        color: #021400;
        font-weight: 700;
        box-shadow: 0 0 18px rgba(0, 200, 5, 0.25);
      }
      .btn.pass {
        background: transparent;
        border: 1px solid var(--line-strong);
        color: var(--muted);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .roles {
        border-top: 1px solid var(--line);
        padding: 6px 20px 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 28px;
      }
      @media (max-width: 680px) {
        .roles {
          grid-template-columns: 1fr;
        }
      }
      .role {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .role:last-child,
      .role:nth-last-child(2):nth-child(odd) {
        border-bottom: none;
      }
      .role .rn {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        margin-bottom: 5px;
      }
      .role.scout .rn {
        color: var(--green);
      }
      .role.bull .rn {
        color: var(--green-soft);
      }
      .role.bear .rn {
        color: var(--loss);
      }
      .role.risk .rn {
        color: #ffb400;
      }
      .role.pm .rn {
        color: var(--text);
      }
      .role p {
        font-size: 0.88rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .prop-resolved {
        padding: 14px 20px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 12px;
        display: none;
      }
      .prop.approved .prop-resolved {
        display: block;
        color: var(--green);
      }
      .prop.passed .prop-resolved {
        display: block;
        color: var(--muted);
      }
      .prop.suggested .prop-resolved {
        display: block;
        color: #ffb400;
      }
      .prop.approved .prop-actions,
      .prop.passed .prop-actions,
      .prop.suggested .prop-actions {
        display: none;
      }
      .btn.suggest {
        background: none;
        color: #ffb400;
        border: 1px solid rgba(255, 180, 0, 0.4);
      }
      .btn.suggest:hover {
        background: rgba(255, 180, 0, 0.1);
      }
      .mini.reopen {
        color: var(--muted);
        margin-left: 8px;
      }
      /* write-in suggestion box */
      .suggest-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sg-lab {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #ffb400;
      }
      .sg-input {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg-2);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        color: var(--text);
        font-family: inherit;
        font-size: 0.92rem;
        padding: 9px 11px;
        resize: vertical;
      }
      .sg-input:focus {
        outline: 2px solid rgba(255, 180, 0, 0.5);
        outline-offset: 1px;
      }
      .sg-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      /* your-decisions archive */
      #archive {
        margin-top: 6px;
      }
      .arch-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .arch-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-left: 2px solid var(--line-strong);
        border-radius: 8px;
        font-size: 0.86rem;
      }
      .arch-row.approved {
        border-left-color: var(--green);
      }
      .arch-row.passed {
        border-left-color: var(--loss);
      }
      .arch-row.suggested {
        border-left-color: #ffb400;
      }
      .arch-row.reopened {
        border-left-color: var(--muted-2);
        opacity: 0.7;
      }
      .arch-ev {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .arch-sym {
        font-family: var(--mono);
        font-weight: 600;
        color: var(--text);
      }
      .arch-sug {
        color: #ffb400;
        font-style: italic;
      }
      .arch-t {
        margin-left: auto;
        color: var(--muted-2);
        font-family: var(--mono);
        font-size: 10px;
      }

      /* no-action */
      .noact {
        border: 1px dashed var(--line-strong);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 10px;
        background: rgba(255, 255, 255, 0.015);
      }
      .noact .ns {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .noact .ns b {
        color: var(--text);
      }
      .noact p {
        font-size: 0.88rem;
        color: var(--muted);
      }

      /* holdings table */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--muted-2);
        text-transform: uppercase;
        text-align: right;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-weight: 500;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
        font-family: var(--mono);
        font-size: 0.85rem;
      }
      td.sym {
        font-family: var(--body);
        font-weight: 700;
        font-size: 0.95rem;
        font-variant-numeric: normal;
      }
      .theme {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        padding: 2px 6px;
        border-radius: 8px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        margin-left: 8px;
      }
      .theme.miner {
        color: #ffb400;
        background: rgba(255, 180, 0, 0.1);
      }
      .theme.ai {
        color: var(--green);
        background: rgba(0, 200, 5, 0.1);
      }
      tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }

      /* decision log */
      .logrow {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        align-items: baseline;
      }
      @media (max-width: 600px) {
        .logrow {
          grid-template-columns: 1fr;
          gap: 3px;
        }
      }
      .logrow .lt {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted-2);
        letter-spacing: 0.06em;
      }
      .logrow .ld {
        font-size: 0.88rem;
        color: var(--muted);
      }
      .logrow .ld .badge {
        font-family: var(--mono);
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 6px;
        margin-right: 8px;
        letter-spacing: 0.06em;
      }
      .badge.TRIM {
        background: rgba(255, 180, 0, 0.14);
        color: #ffb400;
      }
      .badge.SELL {
        background: rgba(255, 80, 0, 0.14);
        color: var(--loss);
      }
      .badge.HOLD,
      .badge.NO_BUY,
      .badge.FLAG {
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }
      .badge.BENCHMARK_SET,
      .badge.BUY {
        background: rgba(0, 200, 5, 0.12);
        color: var(--green);
      }
      .by {
        font-family: var(--mono);
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 6px;
        letter-spacing: 0.04em;
      }
      .by.you {
        background: rgba(0, 200, 5, 0.12);
        color: var(--green);
      }
      .by.auto {
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }
      .ld b {
        color: var(--text);
        font-weight: 600;
      }

      footer {
        margin-top: 50px;
        border-top: 1px solid var(--line);
        padding-top: 20px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted-2);
        letter-spacing: 0.04em;
        line-height: 1.7;
      }
      .loading {
        padding: 60px 0;
        text-align: center;
        font-family: var(--mono);
        color: var(--muted);
        letter-spacing: 0.1em;
      }
      .err {
        color: var(--loss);
      }

      /* ---- audit batch additions ---- */
      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
        border-radius: 4px;
      }
      /* breach chips become links to their fix */
      .chip.linked {
        display: block;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition: border-color 0.2s ease;
      }
      .chip.linked:hover {
        border-color: var(--loss);
      }
      .chip-fix {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.1em;
        color: var(--loss);
        margin-top: 8px;
      }
      /* agreement signal: amber when not unanimous */
      /* color every theme tag (was only miner/ai) */
      .theme.megacap {
        color: #6ea8ff;
        background: rgba(110, 168, 255, 0.1);
      }
      .theme.spec {
        color: var(--loss);
        background: rgba(255, 80, 0, 0.1);
      }
      .theme.cashlike {
        color: var(--muted);
        background: rgba(255, 255, 255, 0.06);
      }
      /* holdings: dollar sub-amount + totals row */
      td .amt {
        color: var(--muted);
        font-size: 0.78rem;
        margin-left: 4px;
      }
      tr.tot td {
        border-top: 1px solid var(--line-strong);
        border-bottom: none;
        font-weight: 700;
        padding-top: 13px;
      }
      tr.tot:hover td {
        background: transparent;
      }
      /* decision log run subheader */
      .logrun {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--green);
        text-transform: uppercase;
        margin: 18px 0 4px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .logrun:first-of-type {

    </style>
  </head>
  <body>
    <div class="grid-bg"></div>
    <div class="glow"></div>

    <header class="bar">
      <span class="brand"><span class="tick">▲</span> PENDULUM&nbsp;PRO</span>
      <button
        class="live"
        id="liveBtn"
        onclick="toggleLive()"
        aria-pressed="false"
        title="Toggle live prices — free Finnhub feed"
      >
        <span class="dot"></span> <span id="liveLabel">LIVE · OFF</span
        ><span class="live-time" id="liveTime"></span>
      </button>
      <nav class="nav" aria-label="Sections">
        <a href="#sec-check">Check</a>
        <a href="#sec-proposals">Proposals</a>
        <a href="#sec-holdings">Holdings</a>
        <a href="#sec-log">Log</a>
      </nav>
      <div class="spacer"></div>
      <div class="stat">
        <span class="k">Account</span><span class="v" id="b-acct">—</span>
      </div>
      <div class="stat">
        <span class="k">Value</span><span class="v" id="b-val">—</span>
      </div>
      <div class="stat">
        <span class="k">Today</span><span class="v" id="b-day">—</span>
      </div>
      <div class="stat">
        <span class="k">vs SPY</span><span class="v" id="b-spy">—</span>
      </div>
      <button class="toggle" id="plainBtn" onclick="togglePlain()">
        Plain English
      </button>
      <button class="toggle" id="themeBtn" onclick="toggleTheme()">
        ☾ Dark
      </button>
    </header>

    <main class="wrap">
      <h1>Control Room</h1>
      <p class="sub" id="asof">Loading the desk…</p>

      <nav class="tabs" id="tabs" aria-label="Accounts"></nav>

      <div id="app" class="loading">
        Reading portfolio, proposals, and the decision log…
      </div>
    </main>

    <script>
      // Caps mirror playbook.md — keep in sync if you edit the playbook.
      const CAPS = { cashFloorMin: 5, themeMax: 35, singleMax: 12 };
      const fmtUSD = (n) =>
        "$" +
        n.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";
      const signed = (n) => (n >= 0 ? "+" : "-") + fmtUSD(Math.abs(n));
      const esc = (s) =>
        String(s).replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );

      let VIEWS = {};
      let ORDER = [];
      // live-prices state (free Finnhub feed; off by default)
      const LIVE = {
        on: false,
        prices: {},
        key: localStorage.getItem("desk-finnhub-key") || "",
        timer: null,
        acct: null,
        lastTs: 0,
      };

      async function load() {
        let portfolio, proposals, logText;
        const v = "?v=" + Date.now(); // cache-bust: always load fresh data
        try {
          [portfolio, proposals] = await Promise.all([
            fetch("./data/portfolio.json" + v).then((r) => r.json()),
            fetch("./data/proposals.json" + v).then((r) => r.json()),
          ]);
          logText = await fetch("./data/decisions.jsonl" + v).then((r) =>
            r.text(),
          );
        } catch (e) {
          document.getElementById("app").innerHTML =
            '<div class="err">Could not load data files. Serve this folder over http (not file://) so fetch works.</div>';
          return;
        }
        const lines = logText.trim().split("\n");
        VIEWS = {};
        ORDER = [];
        portfolio.accounts.forEach((a) => {
          const ap = (proposals.accounts && proposals.accounts[a.id]) || {};
          const port = {
            account: a.account,
            name: a.name,
            broker: a.broker,
            mandate: a.mandate,
            mandateNote: a.mandateNote || "",
            accountType: a.broker + " · " + a.mandate,
            asOfLabel: a.asOfLabel || portfolio.asOf,
            cash: a.cash || 0,
            baseline: a.baseline,
            benchmark: portfolio.benchmark,
            positions: a.positions,
            history: a.history || [],
            historyPct: a.historyPct || 0,
            activity: a.activity || [],
            goal: a.goal || "",
            horizon: a.horizon || "",
            taxTreatment: a.taxTreatment || "",
            goalConfirmed: a.goalConfirmed !== false,
          };
          const prop = {
            runId: a.id + ":" + (proposals.runId || "run"),
            headline: ap.headline || "",
            proposals: ap.proposals || [],
            noAction: ap.noAction || [],
            independentCheck: ap.independentCheck || null,
            trueConcentration: ap.trueConcentration || null,
            deployment: ap.deployment || null,
            costMeter: proposals.costMeter || "",
          };
          const acctLog = lines
            .filter((l) => {
              try {
                return JSON.parse(l).account === a.id;
              } catch (e) {
                return false;
              }
            })
            .join("\n");
          const value =
            a.positions.reduce((s, p) => s + p.qty * p.price, 0) +
            (a.cash || 0);
          VIEWS[a.id] = {
            port,
            prop,
            logText: acctLog,
            mandate: a.mandate,
            name: a.name,
            value,
          };
          ORDER.push(a.id);
        });
        renderTabs();
        const def =
          portfolio.accounts.find((a) => a.mandate === "managed") ||
          portfolio.accounts[0];
        show(def.id);
      }

      function renderTabs() {
        const grand = ORDER.reduce((s, id) => s + VIEWS[id].value, 0);
        document.getElementById("tabs").innerHTML =
          ORDER.map((id) => {
            const vw = VIEWS[id];
            return `<button class="tab" data-acct="${id}" onclick="show('${id}')"><span class="tab-name">${esc(vw.name)}</span><span class="tab-mandate ${vw.mandate}">${vw.mandate}</span><span class="tab-val">${fmtUSD(vw.value)}</span></button>`;
          }).join("") +
          `<div class="tab-grand">All accounts<b>${fmtUSD(grand)}</b></div>`;
      }

      function show(acctId) {
        document
          .querySelectorAll(".tab")
          .forEach((t) =>
            t.classList.toggle("active", t.dataset.acct === acctId),
          );
        const changed = LIVE.acct !== acctId;
        LIVE.acct = acctId; // set before render so the archive filters to this account
        const vw = VIEWS[acctId];
        render(vw.port, vw.prop, vw.logText);
        if (changed && LIVE.on) startLive(); // re-arm polling for the newly shown account
      }

      function render(port, prop, logText) {
        // ---- compute positions ----
        const rows = port.positions
          .map((p) => {
            const lp = LIVE.on ? LIVE.prices[p.symbol] : null;
            const price = lp && lp.c != null ? lp.c : p.price;
            const prevClose = lp && lp.pc != null ? lp.pc : p.prevClose;
            const value = p.qty * price,
              cost = p.qty * p.avgCost;
            return {
              ...p,
              price,
              prevClose,
              value,
              cost,
              pnl: value - cost,
              pnlPct: ((value - cost) / cost) * 100,
              dayPct: ((price - prevClose) / prevClose) * 100,
            };
          })
          .sort((a, b) => b.value - a.value);
        const liveSpy =
          LIVE.on && LIVE.prices.SPY && LIVE.prices.SPY.c != null
            ? LIVE.prices.SPY.c
            : port.benchmark.price;
        const total = rows.reduce((s, r) => s + r.value, 0);
        const themeSum = {};
        rows.forEach(
          (r) => (themeSum[r.theme] = (themeSum[r.theme] || 0) + r.value),
        );
        const top = rows[0];
        const topPct = (top.value / total) * 100;
        const cashPct = ((port.cash + (themeSum.cashlike || 0)) / total) * 100; // true cash + SGOV

        // ---- top bar ----
        document.getElementById("b-acct").textContent = port.account;
        document.getElementById("b-val").textContent = fmtUSD(total);
        const totalPrev = rows.reduce((s, r) => s + r.qty * r.prevClose, 0);
        const dayMove = ((total - totalPrev) / totalPrev) * 100;
        const dayEl = document.getElementById("b-day");
        dayEl.textContent = pct(dayMove);
        dayEl.className = "v " + (dayMove >= 0 ? "up" : "dn");
        // vs SPY: real return vs benchmark from the day-zero baseline (0.0% on day zero)

          "v " + (vsSpyShown === 0 ? "flat" : vsSpyShown > 0 ? "up" : "dn");
        document.getElementById("asof").innerHTML =
          `${port.asOfLabel} · ${esc(port.accountType)} · benchmark <b>SPY ${liveSpy.toFixed(2)}</b>${LIVE.on ? ` <span class="up">● live</span>` : ""} · <span class="flat">vs-SPY from ${esc(base.date || "baseline")}</span>`;

        let h = "";
        const managed = port.mandate !== "monitor";
        const runId = prop.runId || "run";
        const fix = managed ? "#sec-proposals" : null;

        // ---- balance + chart (the showcase) ----

        else if (topThemePct > CAPS.themeMax)
          gist = `Too concentrated in ${(THEME_LABEL[topThemeKey] || topThemeKey).toLowerCase()} (${topThemePct.toFixed(0)}% of the account).`;
        else if (cashPct < CAPS.cashFloorMin)
          gist = `Decent spread, but almost no cash cushion.`;

        const r0 = port.history[0];

        h += `<div class="balance-card">

          ${port.goal ? `<div class="bal-goal">🎯 ${esc(port.goal)} · ${esc(port.horizon)}${!port.goalConfirmed ? `<span class="unset">confirm</span>` : ""}</div>` : ""}
        </div>
        <div class="bal-gist">${managed ? "📋" : "👁"} ${esc(gist)}</div>
      </div>
      ${chartSVG(port.history)}
      ${port.history.length ? `<div class="bal-axis"><span>${esc(r0.d)}</span><span>peak ${fmtUSD(Math.max(...port.history.map((p) => p.v)))}</span><span>${esc(rN.d)}</span></div>` : ""}
    </div>`;

        // ---- playbook check ----
        h += `<div class="section-label anchor" id="sec-check">Playbook check</div><div class="checks">`;
        if (prop.trueConcentration) {

        h += chip(

        <div class="pick-top"><span class="pick-sym">${esc(pk.sym)}</span><span class="pick-name">${esc(pk.name)}</span><span class="pick-amt">${fmtUSD(pk.amt)}${sh ? ` <span class="pick-sh">≈${sh.toFixed(sh < 1 ? 2 : 1)} sh @ ${fmtUSD(pk.px)}</span>` : ""}</span>${pk.kind ? `<span class="prop-kind">${esc(pk.kind)}</span>` : ""}</div>

            h += `<div class="muted-note">New money — <b>no tax</b> on these buys. Fidelity has no API, so you'll place these by hand (or tell me to set up Robinhood-sleeve tickets). When you deposit, say the amount and I'll refresh prices + finalize share counts.</div>`;

          h += `<div id="archive"></div>`;
        } else {

        }

        // ---- holdings ----
        h += `<div class="section-label anchor" id="sec-holdings">Holdings <span class="count">· ${rows.length} positions · ${fmtUSD(total)}</span></div>`;
        const totCost = rows.reduce((s, r) => s + r.cost, 0);
        const totPnlPct = ((total - totCost) / totCost) * 100;

        rows.forEach((r) => {

        const rowHtml = (r) => {

      <td class="sym indent">${r.symbol}<span class="theme ${r.theme}">${r.theme}</span></td>
      <td>${fmtUSD(r.value)}</td>
      <td class="flat">${((r.value / total) * 100).toFixed(1)}%</td>
      <td class="${r.pnl >= 0 ? "up" : "dn"}">${pct(r.pnlPct)} <span class="amt">${signed(r.pnl)}</span></td>
      <td class="${r.dayPct >= 0 ? "up" : "dn"}">${pct(r.dayPct)} <span class="amt">${signed(dayAmt)}</span></td>
    </tr>`;
        };
        h += `<table><thead><tr><th>Symbol</th><th>Value</th><th>Wt</th><th>P&L</th><th>Today</th></tr></thead><tbody>`;
        themeOrder.forEach((t) => {
          const tw = (themeSum[t] / total) * 100;
          const overCap = t === "miner" && tw > CAPS.themeMax;
          h += `<tr class="grp"><td class="sym">${THEME_LABEL[t] || t}<span class="grp-n">${byTheme[t].length}</span></td><td>${fmtUSD(themeSum[t])}</td><td class="${overCap ? "dn" : "flat"}">${tw.toFixed(1)}%</td><td></td><td></td></tr>`;
          byTheme[t].forEach((r) => {

          });
        });
        h += `<tr class="tot"><td class="sym">TOTAL</td><td>${fmtUSD(total)}</td><td class="flat">100.0%</td><td class="${total - totCost >= 0 ? "up" : "dn"}">${pct(totPnlPct)} <span class="amt">${signed(total - totCost)}</span></td><td></td></tr>`;
        h += `</tbody></table>`;

        // ---- recent activity (real broker fills) ----
        if (port.activity && port.activity.length) {
          h += `<div class="section-label anchor" id="sec-activity">Recent activity <span class="count">· last ${port.activity.length} fills · live from ${esc(port.broker)}</span></div>`;
          h += `<table><thead><tr><th>Date</th><th>Action</th><th>Symbol</th><th>Shares</th><th>Price</th><th>By</th></tr></thead><tbody>`;
          port.activity.forEach((a) => {
            const side = (a.side || "").toUpperCase();
            const sh = (+a.qty).toLocaleString("en-US", {

            h += `<tr>
      <td class="flat">${esc(a.d)}</td>

    </tr>`;

          h += `<div class="muted-note">Real fills pulled from ${esc(port.broker)} on each run. <b>By</b> tags who placed each order: <b>you</b> (a manual tap in the app) vs <b>auto</b> (the fund / recurring). Read-only ledger — the desk never places these.</div>`;
        }

        // ---- decision log ----
        const logs = logText
          .trim()
          .split("\n")
          .map((l) => {
            try {

          })
          .filter(Boolean)
          .reverse();

        // ---- scorecard: how the desk's past calls are doing ----
        const priceMap = {};
        rows.forEach((r) => (priceMap[r.symbol] = r.price));
        const calls = logs.filter((l) => l.type === "proposal");
        if (calls.length) {
          h += `<div class="section-label anchor" id="sec-score">Scorecard <span class="count">· how the desk's calls are doing</span></div>`;
          h += `<table><thead><tr><th>Call</th><th>At</th><th>Now</th><th>Since</th><th>Verdict</th></tr></thead><tbody>`;
          calls.forEach((l) => {
            const now = priceMap[l.symbol];
            let nowTxt = "—",
              sinceTxt = "—",
              sinceCls = "flat",
              verdict = "position closed / not held";
            if (now != null && l.price) {
              const since = (now / l.price - 1) * 100;
              const trim = l.action === "TRIM" || l.action === "SELL";
              sinceTxt = pct(since);
              nowTxt = fmtUSD(now);
              if (Math.abs(since) < 0.3) {
                verdict = "too soon to call (same session)";
                sinceCls = "flat";
              } else if (trim) {
                verdict =
                  since < 0
                    ? "good trim so far · it fell after"
                    : "early cost · it rose after";

              }
            }
            h += `<tr>

      <td>${nowTxt}</td>

    </tr>`;
          });
          h += `</tbody></table>`;
          h += `<div class="muted-note scorefoot">⚠ Tiny sample (a handful of calls over days). This is <b>noise</b> until ~10+ calls over months — don't read skill into it yet. And vs-SPY up top is <b>not risk-adjusted</b>: beating SPY while holding ~3× its volatility is leverage, not skill.</div>`;
        }

        h += `<div class="section-label anchor" id="sec-log">Decision log <span class="count">· ${logs.length} entries · the scoreboard</span></div>`;
        let lastRun = null;

        });

        h += `<footer>${esc(prop.costMeter)}<br>For discussion only. Not investment advice. PendulumPro proposes; you approve and place every order by hand at your broker. No auto-execution. Markets carry real risk of loss.</footer>`;

      // "Approve all" — armed only once you've actually scrolled through every proposal
      function setupApproveAll(proposals, runId) {
        const btn = document.getElementById("approveAllBtn");
        if (!btn) return;
        const pending = proposals
          .map((p) => p.id)
          .filter((id) => !localStorage.getItem("desk-" + runId + "-" + id));
        if (!pending.length) {
          btn.style.display = "none";
          return;
        }
        const viewed = new Set();
        const check = () => {
          const vh = window.innerHeight;
          pending.forEach((id) => {
            const el = document.getElementById("prop-" + id);
            if (!el) return;
            const r = el.getBoundingClientRect();
            if (r.top < vh * 0.9 && r.bottom > 0) viewed.add(id);
          });
          const all = pending.every((id) => viewed.has(id));
          btn.disabled = !all;
          btn.textContent = all
            ? `Approve all (${pending.length})`
            : `Approve all · scroll through them (${viewed.size}/${pending.length})`;
        };
        window.addEventListener("scroll", check, { passive: true });
        window.addEventListener("resize", check);
        check();
      }
      function approveAll() {
        const p = window.__props || {};
        Object.keys(p).forEach((id) => {
          if (!localStorage.getItem("desk-" + p[id].runId + "-" + id))
            resolve(id, "approve");
        });
        const btn = document.getElementById("approveAllBtn");
        if (btn) btn.style.display = "none";
      }

      function chip(lab, big, meta, pass, neutral, href) {
        const cls = neutral ? "" : pass ? "pass" : "fail";
        const breach = !neutral && !pass;
        const tag = neutral
          ? ""
          : `<span class="tag">${pass ? "OK" : "BREACH"}</span>`;
        const fix =
          breach && href ? `<div class="chip-fix">Fix it ↓</div>` : "";
        const inner = `${tag}<div class="lab">${lab}</div><div class="big">${big}</div><div class="meta">${meta}</div>${fix}`;
        return breach && href
          ? `<a class="chip ${cls} linked" href="${href}">${inner}</a>`
          : `<div class="chip ${cls}">${inner}</div>`;
      }
      function role(cls, name, txt) {
        return `<div class="role ${cls}"><div class="rn">${name.toUpperCase()}</div><p>${esc(txt)}</p></div>`;
      }

      // Portfolio-value sparkline from [{d, v}] history (peaks + valleys, Fidelity-style)
      function chartSVG(history) {
        if (!history || history.length < 2) return "";
        const W = 720,
          H = 170,
          pad = 8;
        const vals = history.map((p) => p.v);
        const min = Math.min(...vals),
          max = Math.max(...vals);
        const rng = max - min || 1;
        const X = (i) => pad + (i * (W - 2 * pad)) / (history.length - 1);
        const Y = (v) => pad + (1 - (v - min) / rng) * (H - 2 * pad);
        const line = history
          .map(
            (p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`,
          )
          .join(" ");
        const area = `${line} L${X(history.length - 1).toFixed(1)},${H} L${X(0).toFixed(1)},${H} Z`;
        const up = history[history.length - 1].v >= history[0].v;
        const col = up ? "var(--green)" : "var(--loss)";
        const lastX = X(history.length - 1).toFixed(1);
        const lastY = Y(history[history.length - 1].v).toFixed(1);
        return `<svg class="balchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="balgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".22"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#balgrad)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="${col}"/>
    </svg>`;
      }

      function ticketFor(p) {
        const verb = p.action === "BUY" ? "BUY" : "SELL";
        return `${verb} ${p.symbol} · ${p.sizing}`;
      }
      function copyTicket(id) {
        const p = (window.__props || {})[id];
        const btn = document.querySelector(`[onclick="copyTicket('${id}')"]`);
        if (p && navigator.clipboard) {
          navigator.clipboard.writeText(ticketFor(p));
          if (btn) {
            btn.textContent = "Copied ✓";
            setTimeout(() => (btn.textContent = "Copy"), 1500);
          }
        }
      }
      function deskKey(id) {
        const p = (window.__props || {})[id] || {};
        return (p.runId || "run") + "-" + id;
      }
      function applyResolved(id, kind) {
        const p = (window.__props || {})[id];
        const card = document.getElementById("prop-" + id);
        const res = document.getElementById("res-" + id);
        if (!card || !res) return;
        card.classList.remove("approved", "passed", "suggested");
        const reopenBtn = `<button class="mini reopen" onclick="reopen('${id}')">↩ reopen</button>`;
        if (kind === "approve") {
          card.classList.add("approved");
          const tkt = p ? ticketFor(p) : "";
          const broker = (p && p.broker) || "Robinhood";
          const sym = p ? encodeURIComponent(p.symbol) : "";
          const link =
            broker === "Fidelity"
              ? "https://digital.fidelity.com/prgw/digital/research/quote/dashboard/summary?symbol=" +
                sym
              : "https://robinhood.com/stocks/" + sym;
          res.innerHTML = `✓ APPROVED. Place by hand: <code class="ticket">${esc(tkt)}</code> <button class="mini" onclick="copyTicket('${id}')">Copy</button> <a class="mini" href="${link}" target="_blank" rel="noopener">Open in ${esc(broker)} ↗</a> ${reopenBtn} <span class="muted-note">PendulumPro never executes; you do.</span>`;
        } else if (kind === "suggest") {
          card.classList.add("suggested");
          const text =
            localStorage.getItem("desk-suggest-" + deskKey(id)) || "";
          (window.__deskPrompt = window.__deskPrompt || {})[id] =
            "Re: " +
            (p
              ? p.action + " " + p.symbol + " (" + p.sizing + ")"
              : "proposal") +
            " — my counter: " +
            text +
            ". Brainstorm this against the playbook and revise the proposal.";
          res.innerHTML = `💬 <b>Your counter:</b> ${esc(text)} <button class="mini" onclick="copyDesk('${id}')">Copy for the desk →</button> ${reopenBtn}<br><span class="muted-note">Paste that to PendulumPro in a session — it'll brainstorm and revise this card.</span>`;
        } else {
          card.classList.add("passed");
          res.innerHTML = `✕ Passed. Logged as no-action. ${reopenBtn}`;
        }
      }
      function resolve(id, kind) {
        if (kind === "suggest") return openSuggest(id);
        localStorage.setItem("desk-" + deskKey(id), kind);
        logDecision(id, kind === "approve" ? "approved" : "passed");
        applyResolved(id, kind);
      }
      function openSuggest(id) {
        const res = document.getElementById("res-" + id);
        const card = document.getElementById("prop-" + id);
        if (!res || !card) return;
        card.classList.add("suggested"); // reveal the resolved area for the form
        const prev = localStorage.getItem("desk-suggest-" + deskKey(id)) || "";
        res.innerHTML = `<div class="suggest-box">
        <label class="sg-lab" for="sg-${id}">💬 Your counter — type it, the desk brainstorms on it</label>
        <textarea id="sg-${id}" class="sg-input" rows="3" placeholder="e.g. trim only half · wait until earnings · what about LLY instead?">${esc(prev)}</textarea>
        <div class="sg-actions"><button class="btn approve" onclick="saveSuggest('${id}')">Save suggestion</button><button class="mini reopen" onclick="reopen('${id}')">cancel</button></div>
      </div>`;
        const ta = document.getElementById("sg-" + id);
        if (ta) ta.focus();
      }
      function saveSuggest(id) {
        const ta = document.getElementById("sg-" + id);
        const text = ((ta && ta.value) || "").trim();
        if (!text) return;
        localStorage.setItem("desk-" + deskKey(id), "suggest");
        localStorage.setItem("desk-suggest-" + deskKey(id), text);
        logDecision(id, "suggested", text);
        applyResolved(id, "suggest");
      }
      function reopen(id) {
        localStorage.removeItem("desk-" + deskKey(id));
        localStorage.removeItem("desk-suggest-" + deskKey(id));
        logDecision(id, "reopened");
        const card = document.getElementById("prop-" + id);
        const res = document.getElementById("res-" + id);
        if (card) card.classList.remove("approved", "passed", "suggested");
        if (res) res.innerHTML = "";
      }
      function copyDesk(id) {
        const t = (window.__deskPrompt || {})[id];
        const btn = document.querySelector(`[onclick="copyDesk('${id}')"]`);
        if (t && navigator.clipboard) {
          navigator.clipboard.writeText(t);
          if (btn) {
            btn.textContent = "Copied ✓";
            setTimeout(() => (btn.textContent = "Copy for the desk →"), 1500);
          }
        }
      }
      // ---- decisions archive (every approve/pass/suggest/reopen, reversible) ----
      function getArchive() {
        try {
          return JSON.parse(localStorage.getItem("desk-archive") || "[]");
        } catch (e) {
          return [];
        }
      }
      function logDecision(id, event, suggestion) {
        const p = (window.__props || {})[id] || {};
        const arr = getArchive();
        arr.push({
          ts: Date.now(),
          acct: LIVE.acct || "",
          runId: p.runId || "run",
          pid: id,
          symbol: p.symbol || "",
          action: p.action || "",
          event: event,
          suggestion: suggestion || "",
        });
        localStorage.setItem("desk-archive", JSON.stringify(arr.slice(-200)));
        renderArchive();
      }
      const EV_LABEL = {
        approved: "✓ Approved",
        passed: "✕ Passed",
        suggested: "💬 Suggested",
        reopened: "↩ Reopened",
      };
      function renderArchive() {
        const el = document.getElementById("archive");
        if (!el) return;
        const rows = getArchive()
          .filter((r) => r.acct === LIVE.acct)
          .reverse();
        if (!rows.length) {
          el.innerHTML = "";
          return;
        }
        let h = `<div class="section-label anchor" id="sec-archive">Your decisions <span class="count">· ${rows.length} logged · reversible</span></div><div class="arch-list">`;
        rows.forEach((r) => {
          const t = new Date(r.ts).toLocaleString("en-US", {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
          });
          h += `<div class="arch-row ${r.event}"><span class="arch-ev">${EV_LABEL[r.event] || r.event}</span><span class="arch-sym">${esc(r.action)} ${esc(r.symbol)}</span>${r.suggestion ? `<span class="arch-sug">“${esc(r.suggestion)}”</span>` : ""}<span class="arch-t">${t}</span></div>`;
        });
        h += `</div><button class="mini" onclick="clearArchive()">Clear archive</button>`;
        el.innerHTML = h;
      }
      function clearArchive() {
        if (!confirm("Clear your decision archive? This can't be undone."))
          return;
        localStorage.removeItem("desk-archive");
        renderArchive();
      }

      // ---- plain-english + light/dark toggles (persisted) ----
      function togglePlain() {
        const on = document.body.classList.toggle("plain");
        localStorage.setItem("desk-plain", on ? "1" : "0");
        syncPlainBtn();
      }
      function syncPlainBtn() {
        const on = document.body.classList.contains("plain");
        const b = document.getElementById("plainBtn");
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on);
        b.textContent = on ? "Plain English ✓" : "Plain English";
      }
      function toggleTheme() {
        const light =
          document.documentElement.getAttribute("data-theme") !== "light";
        document.documentElement.setAttribute(
          "data-theme",
          light ? "light" : "dark",
        );
        localStorage.setItem("desk-theme", light ? "light" : "dark");
        syncThemeBtn();
      }
      function syncThemeBtn() {
        const light =
          document.documentElement.getAttribute("data-theme") === "light";
        const tb = document.getElementById("themeBtn");
        tb.setAttribute("aria-pressed", light);
        tb.textContent = light ? "☀ Light" : "☾ Dark";
      }
      // ---- live prices (free Finnhub feed; real-time US quotes) ----
      async function pollLive() {
        if (!LIVE.on || !LIVE.key || !LIVE.acct) return;
        const vw = VIEWS[LIVE.acct];
        if (!vw) return;
        const syms = [
          ...new Set(vw.port.positions.map((p) => p.symbol).concat("SPY")),
        ];
        const results = await Promise.all(
          syms.map((s) =>
            fetch(
              `https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(s)}&token=${LIVE.key}`,
            )
              .then((r) => (r.ok ? r.json() : null))
              .then((q) => ({ s, q }))
              .catch((err) => {
                console.warn("[LIVE] quote failed for " + s, err);
                return { s, q: null };
              }),
          ),
        );
        let got = 0;
        results.forEach(({ s, q }) => {
          if (q && typeof q.c === "number" && q.c > 0) {
            LIVE.prices[s] = { c: q.c, pc: q.pc };
            got++;
          }
        });
        const t = document.getElementById("liveTime");
        if (got) {
          LIVE.lastTs = Date.now();
          const y = window.scrollY; // preserve scroll across re-render
          show(LIVE.acct);
          window.scrollTo({ top: y, left: 0, behavior: "instant" }); // beat scroll-behavior:smooth
          syncLiveBtn();
        } else if (t) {
          t.textContent = "⚠ check key";
        }
      }
      function startLive() {
        if (LIVE.timer) clearInterval(LIVE.timer);
        const vw = VIEWS[LIVE.acct];
        const n = vw ? vw.port.positions.length + 1 : 6;
        const interval = n <= 8 ? 12000 : 30000; // stay under Finnhub 60/min free cap
        pollLive();
        LIVE.timer = setInterval(pollLive, interval);
      }
      function stopLive() {
        if (LIVE.timer) clearInterval(LIVE.timer);
        LIVE.timer = null;
      }
      function toggleLive() {
        if (!LIVE.on) {
          if (!LIVE.key) {
            const k = prompt(
              "Paste your free Finnhub API key to turn on live prices.\n\nGet one in 30 seconds at finnhub.io/register — the free tier includes real-time US stock quotes.",
            );
            if (!k) return;
            LIVE.key = k.trim();
            localStorage.setItem("desk-finnhub-key", LIVE.key);
          }
          LIVE.on = true;
          localStorage.setItem("desk-live", "1");
          startLive();
        } else {
          LIVE.on = false;
          localStorage.setItem("desk-live", "0");
          stopLive();
          LIVE.prices = {};
          const y = window.scrollY;
          if (LIVE.acct) show(LIVE.acct); // repaint with snapshot prices
          window.scrollTo({ top: y, left: 0, behavior: "instant" });
        }
        syncLiveBtn();
      }
      function syncLiveBtn() {
        const b = document.getElementById("liveBtn");
        if (!b) return;
        b.classList.toggle("on", LIVE.on);
        b.setAttribute("aria-pressed", LIVE.on);
        const lab = document.getElementById("liveLabel");
        if (lab) lab.textContent = LIVE.on ? "LIVE" : "LIVE · OFF";
        const t = document.getElementById("liveTime");
        if (t)
          t.textContent =
            LIVE.on && LIVE.lastTs
              ? new Date(LIVE.lastTs).toLocaleTimeString("en-US", {
                  hour: "numeric",
                  minute: "2-digit",
                  second: "2-digit",
                })
              : "";
      }
      function initLive() {
        if (localStorage.getItem("desk-live") === "1" && LIVE.key) {
          LIVE.on = true;
          if (!LIVE.acct) LIVE.acct = ORDER[0];
          startLive();
        }
        syncLiveBtn();
      }

      // apply saved prefs before first paint of controls
      if (localStorage.getItem("desk-plain") === "1")
        document.body.classList.add("plain");
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("desk-theme") ||
          (window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark"),
      );
      syncPlainBtn();
      syncThemeBtn();

      load().then(initLive);
    </script>
  </body>
</html>
